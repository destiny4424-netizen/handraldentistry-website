<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Handral Trading Desk</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><img class="logo" src="/icon.svg" alt=""> Handral <b>Trading Desk</b><span id="brokerTag" class="pill hidden">Zerodha</span><span id="demo" class="pill warn hidden">DEMO</span></div>
  <div class="top-right">
    <span id="funds" class="funds" title="Available to trade"></span>
    <span id="conn" class="dot" title="Dhan connection"></span>
  </div>
</header>
<div id="banner" class="banner hidden"></div>
<nav class="tabs" id="tabs">
  <button data-tab="watch" class="on"><i>☰</i><span>Watchlist</span></button>
  <button data-tab="quick"><i>⚡</i><span>Quick</span></button>
  <button data-tab="positions"><i>◧</i><span>Positions</span></button>
  <button data-tab="orders"><i>⇄</i><span>Orders</span><b id="ordersBadge" class="badge hidden"></b></button>
  <button data-tab="screener"><i>◎</i><span>Screener</span></button>
  <button data-tab="account"><i>◉</i><span>Account</span></button>
</nav>
<main id="main">
  <section id="tab-watch" class="tab on">
    <div class="search"><input id="q" type="search" placeholder="Search stocks, indices, futures, options  (e.g. nifty 26000 ce)" autocomplete="off" spellcheck="false"></div>
    <div id="results" class="results hidden"></div>
    <div id="mkIdx" class="mk-idx"></div>
    <div id="mkBreadth"></div>
    <div class="wl-head"><div id="wlTabs" class="chips scroll"></div><button id="wlEdit" class="ghost sm">Edit</button></div>
    <div id="wlView">
      <div class="wl-filter"><button id="wlFilter" class="chip-toggle">F&amp;O · good volume</button><span id="wlHidden" class="muted small"></span></div>
      <div id="wl" class="list"></div>
      <div id="wlEmpty" class="empty hidden">This list is empty. Search above and tap ＋ to add stocks, indices, futures or options.</div>
    </div>
    <div id="mkView" class="hidden">
      <div class="wl-filter"><button id="mkGood" class="chip-toggle">F&amp;O · good volume only</button></div>
      <div id="mkRule" class="muted small"></div>
      <div id="mkNote" class="muted small" style="margin:8px 0"></div>
      <div id="mkList" class="list"></div>
    </div>
  </section>
  <section id="tab-quick" class="tab">
    <div class="card qk">
      <div class="qk-row"><input id="qkUl" list="qkUls" placeholder="Stock or index, e.g. RELIANCE" autocomplete="off" spellcheck="false" autocapitalize="characters">
        <datalist id="qkUls"></datalist></div>
      <div class="qk-dir"><button id="qkUp" class="qk-up">▲ Going up<small>buy 1-OTM call</small></button>
        <button id="qkDown" class="qk-down">▼ Going down<small>buy 1-OTM put</small></button></div>
      <div id="qkErr" class="error"></div>
    </div>
    <div id="qkPlan"></div>
    <h3 class="qk-h">Quick orders today</h3>
    <div id="qkList" class="list"></div>
  </section>
  <section id="tab-screener" class="tab">
    <form class="sc-look" id="scLook" autocomplete="off">
      <input id="scSym" list="scUls" placeholder="Check a stock, e.g. SBIN" spellcheck="false" autocapitalize="characters">
      <datalist id="scUls"></datalist><button class="go b-buy" id="scGo">Check</button>
    </form>
    <div id="scOut"></div>
    <div class="seg" id="scSeg"><button data-v="intraday" class="on">Intraday</button><button data-v="swing">Swing</button></div>
    <div id="scBody"><div class="muted small">Loading the scanner…</div></div>
  </section>
  <section id="tab-orders" class="tab">
    <div class="chips" id="orderFilter"><button data-f="open" class="on">Open</button><button data-f="done">Executed</button><button data-f="all">All</button></div>
    <div id="armed"></div>
    <div id="orders" class="list" style="margin-top:12px"></div>
  </section>
  <section id="tab-positions" class="tab">
    <div id="pnlCard" class="pnl-card"></div>
    <div id="positions" class="list"></div>
    <div class="row-end"><button id="exitAll" class="danger ghost">Exit all positions</button></div>
  </section>
  <section id="tab-insights" class="tab">
    <button class="ghost sm back-acc" data-go="account">← Account</button>
    <div class="ins-head"><div class="chips" id="insDays"><button data-d="30">30 days</button><button data-d="90" class="on">90 days</button><button data-d="365">1 year</button><button data-d="0">All</button></div>
      <button id="syncBtn" class="ghost sm">↻ Import trades</button></div>
    <div id="syncNote" class="muted small"></div>
    <div id="insights"></div>
  </section>
  <section id="tab-auto" class="tab">
    <button class="ghost sm back-acc" data-go="account">← Account</button>
    <div id="auto"></div>
  </section>
  <section id="tab-account" class="tab">
    <div class="acc-links">
      <button data-go="insights"><i>✦</i><span><b>Insights</b><small>Your P&amp;L, habits and what's costing you</small></span><em>›</em></button>
      <button data-go="auto"><i>⚙</i><span><b>Auto-trader</b><small>The swing bot on MTF, its trades and backtest</small></span><em>›</em></button>
    </div>
    <div id="account"></div>
  </section>
</main>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"><div class="sheet-bg"></div><div class="sheet-body" id="sheetBody"></div></div>
<div id="toasts" class="toasts"></div>
<script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/static/htfklb.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
