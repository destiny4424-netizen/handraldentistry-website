<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#0f5132"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Handral Clinic"/>
<title>Handral Clinic</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f5132'/%3E%3Cpath d='M20 18c-6 0-9 5-8 11 1 5 3 8 4 14 1 4 2 7 4 7s3-4 4-9c1-3 2-5 4-5s3 2 4 5c1 5 2 9 4 9s3-3 4-7c1-6 3-9 4-14 1-6-2-11-8-11-4 0-6 2-8 2s-4-2-8-2z' fill='%23fff'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --brand:#0f5132;--brand2:#15803d;--brand-soft:#e7f4ec;--brand-ink:#0b3d26;
  --bg:#f5f7f6;--card:#ffffff;--line:#e3e8e5;--ink:#15211b;--muted:#5d6b64;--faint:#8a968f;
  --red:#c2322a;--red-soft:#fdecea;--amber:#b45309;--amber-soft:#fef3e2;--blue:#1d4ed8;--blue-soft:#e8eefc;
  --violet:#6d28d9;--violet-soft:#f1eafd;--wa:#1fa855;
  --c-bagalkot:#15803d;--c-vidyagiri:#1d4ed8;--c-navanagar:#6d28d9;
  --r:14px;--shadow:0 1px 2px rgba(16,24,20,.06),0 4px 14px rgba(16,24,20,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.hidden{display:none!important}
@media(max-width:600px){.hide-sm{display:none!important}}
svg.i{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ── Login ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:linear-gradient(160deg,#0b3d26,#15803d)}
.login-card{background:#fff;border-radius:20px;padding:32px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-card .logo{width:56px;height:56px;border-radius:16px;background:var(--brand);display:grid;place-items:center;margin-bottom:16px}
.login-card h1{font-size:22px;margin-bottom:4px}
.login-card p.sub{color:var(--muted);margin-bottom:22px}
.login-err{background:var(--red-soft);color:var(--red);padding:10px 12px;border-radius:10px;margin-bottom:14px;font-size:14px}

/* ── Shell ── */
.top{position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.top .brand{display:flex;align-items:center;gap:10px;min-width:0}
.top .brand b{font-size:16px;white-space:nowrap}
.top .brand small{display:block;font-size:12px;opacity:.8;white-space:nowrap}
.top .grow{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12.5px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:99px;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#7ee2a8}
.sync.saving .dot{background:#fcd34d}.sync.offline .dot,.sync.error .dot{background:#fca5a5}
.clinicbar{background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;position:sticky;top:56px;z-index:25}
.clinicbar::-webkit-scrollbar{display:none}
.cchip{display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;background:#fff}
.cchip .d{width:9px;height:9px;border-radius:50%}
.cchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.layout{display:flex;min-height:calc(100vh - 110px)}
.side{display:none}
main{flex:1;min-width:0;padding:16px 16px 100px;max-width:1100px;margin:0 auto;width:100%}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:11.5px;font-weight:600;color:var(--faint)}
.bnav button.on{color:var(--brand)}
@media(min-width:900px){
  .bnav{display:none}
  .side{display:flex;flex-direction:column;gap:2px;width:220px;flex-shrink:0;padding:16px 10px;border-right:1px solid var(--line);background:#fff;position:sticky;top:110px;height:calc(100vh - 110px);overflow:auto}
  .side button{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-weight:600;color:var(--muted);text-align:left}
  .side button:hover{background:var(--bg)}
  .side button.on{background:var(--brand-soft);color:var(--brand)}
  .side hr{border:0;border-top:1px solid var(--line);margin:8px 6px}
  main{padding:24px 28px 60px}
}

/* ── Building blocks ── */
h2.title{font-size:22px;font-weight:700;margin-bottom:4px}
p.lead{color:var(--muted);margin-bottom:16px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.head .grow{flex:1;min-width:160px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15.5px;flex:1}
.card-b{padding:16px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;font-weight:600;font-size:15px;background:var(--brand);color:#fff;min-height:44px;white-space:nowrap}
.btn:hover{background:var(--brand-ink)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.wa{background:var(--wa)}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid #f3c4c0}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13.5px;border-radius:9px}
.btn.block{width:100%}
.iconbtn{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:700;letter-spacing:-.5px}
.stat span{color:var(--muted);font-size:13px}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media(min-width:700px){.quick{grid-template-columns:repeat(4,1fr)}}
.quick button{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;box-shadow:var(--shadow)}
.quick button:hover{border-color:var(--brand2)}
.quick .qi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.list .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.list .row:last-child{border-bottom:0}
.list .row.tap{cursor:pointer}
.list .row.tap:hover{background:#fafcfb}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex-shrink:0;font-size:15px}
.rmain{flex:1;min-width:0}
.rmain b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmain small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rend{text-align:right;flex-shrink:0;display:flex;align-items:center;gap:6px}
.time{width:58px;flex-shrink:0;font-weight:700;font-size:14px;color:var(--brand)}
.time small{display:block;font-weight:500;color:var(--faint);font-size:11px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.booked{background:var(--blue-soft);color:var(--blue)}
.tag.arrived{background:var(--amber-soft);color:var(--amber)}
.tag.done,.tag.paid{background:var(--brand-soft);color:var(--brand)}
.tag.noshow,.tag.cancelled,.tag.due{background:var(--red-soft);color:var(--red)}
.tag.partly{background:var(--amber-soft);color:var(--amber)}
.cdot{width:8px;height:8px;border-radius:50%;display:inline-block}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty svg{width:40px;height:40px;stroke:var(--faint);margin-bottom:8px}
.search{position:relative;margin-bottom:14px}
.search input{padding-left:44px;height:50px;font-size:16px;border-radius:12px}
.search svg{position:absolute;left:14px;top:15px;color:var(--faint)}
.seg{display:inline-flex;background:#e9eeeb;border-radius:11px;padding:3px;gap:2px;margin-bottom:14px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.banner{border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start}
.banner.info{background:var(--blue-soft);color:#1e3a8a}
.banner.warn{background:var(--amber-soft);color:#7c2d12}
.banner.alert{background:var(--red-soft);color:#7f1d1d}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--muted)}

/* ── Forms ── */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px;min-height:46px;outline:none}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:8px 13px;border-radius:99px;border:1.5px solid var(--line);font-weight:600;font-size:14px;background:#fff}
.pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
.picker{position:relative}
.picker .opts{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.12);z-index:5;max-height:260px;overflow:auto}
.picker .opts button{display:block;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.picker .opts button:hover{background:var(--bg)}
.picked{display:flex;align-items:center;gap:10px;background:var(--brand-soft);border-radius:10px;padding:9px 12px;margin-bottom:12px}
.picked b{flex:1}

/* ── Sheet (modal) ── */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:600px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 12px 12px 20px;border-bottom:1px solid var(--line)}
.sheet-h h3{flex:1;font-size:18px}
.sheet-b{padding:18px 20px;overflow:auto;flex:1}
.sheet-f{padding:12px 20px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-f .btn{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14201a;color:#fff;padding:12px 16px;border-radius:12px;z-index:80;display:flex;align-items:center;gap:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast button{color:#86efac;font-weight:700}
@media(min-width:900px){.toast{bottom:30px}}

/* ── Patient profile ── */
.phero{display:flex;gap:14px;align-items:center;padding:18px 16px}
.phero .av{width:58px;height:58px;font-size:21px}
.phero h2{font-size:20px}
.phero .meta{color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:12px 12px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14.5px}
.kv dt{color:var(--muted)}
.teeth{display:flex;justify-content:center;gap:3px;flex-wrap:nowrap;overflow-x:auto;padding:4px 0}
.teeth .gap{width:10px}
.tooth{width:34px;height:42px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex-shrink:0}
.tooth i{font-style:normal;font-size:10px;font-weight:600}
.tooth.caries{background:#fde68a;border-color:#f59e0b}
.tooth.filling{background:#bfdbfe;border-color:#3b82f6}
.tooth.rct{background:#fecaca;border-color:#ef4444}
.tooth.crown{background:#fef3c7;border-color:#d97706}
.tooth.implant{background:#ddd6fe;border-color:#7c3aed}
.tooth.missing,.tooth.extracted{background:#e5e7eb;border-color:#9ca3af;color:#6b7280}
.tooth.planned{background:#fff;border:2px dashed var(--brand2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:12px;justify-content:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1.5px solid}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.photos figure{border-radius:12px;overflow:hidden;background:#eef2f0;aspect-ratio:1;position:relative;cursor:pointer}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos figcaption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:11.5px;padding:14px 8px 6px}
.timeline .row{align-items:flex-start}
.daystrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.day{flex:1;min-width:0;padding:9px 4px;border-radius:12px;background:#fff;border:1.5px solid var(--line);text-align:center}
.day small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.day b{display:block;font-size:18px}
.day em{display:block;font-style:normal;font-size:11px;color:var(--brand);font-weight:700;min-height:14px}
.day.on{background:var(--brand);border-color:var(--brand);color:#fff}
.day.on small,.day.on em{color:#d1fae5}
.day.today{border-color:var(--brand2)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--muted);font-weight:600;font-size:12.5px;background:#fafcfb}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
.items .it{display:grid;grid-template-columns:1fr 64px 96px 36px;gap:6px;margin-bottom:8px;align-items:center}
.totals{background:var(--bg);border-radius:12px;padding:12px 14px;margin:6px 0 12px}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .big{font-size:18px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:50vh;color:var(--muted)}
.spin{width:34px;height:34px;border:3.5px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px}
.viewer img{max-width:100%;max-height:82vh;border-radius:8px}
</style>
</head>

<script>
'use strict';
// ════════════════════════════════════════════════════════════════════════
//  Basics
// ════════════════════════════════════════════════════════════════════════
const CLINICS = {bagalkot:'Bagalkot', vidyagiri:'Vidyagiri', navanagar:'Navanagar'};
const CCOLOR = {bagalkot:'var(--c-bagalkot)', vidyagiri:'var(--c-vidyagiri)', navanagar:'var(--c-navanagar)'};
const COLS = ['patients','appointments','invoices','payments','transactions','attendance','staff','consultants','consultcases','photos','settings','requests'];
const TREATMENTS = ['Consultation','Scaling & polishing','Filling','Root canal (RCT)','Crown / cap','Extraction','Wisdom tooth removal','Braces consultation','Braces adjustment','Clear aligners (Invisalign)','Implant','Bridge','Dentures','Teeth whitening','X-ray','Kids dentistry','Follow-up'];
const CONDITIONS = [
  {k:'',label:'Healthy',short:''},{k:'caries',label:'Decay',short:'D'},{k:'filling',label:'Filling',short:'F'},
  {k:'rct',label:'Root canal',short:'RC'},{k:'crown',label:'Crown',short:'C'},{k:'implant',label:'Implant',short:'I'},
  {k:'missing',label:'Missing',short:'M'},{k:'extracted',label:'Extracted',short:'X'},{k:'planned',label:'Planned',short:'P'}];
const AVC = ['#0f766e','#1d4ed8','#7c3aed','#b45309','#be123c','#15803d','#0e7490','#4d7c0f'];
const API_DEFAULT = 'https://clinicapi.handraldentistry.com';

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (n, st='') => `<svg class="i" style="${st}"><use href="#i-${n}"/></svg>`;
const uid = p => (p||'') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return dstr(d); };
const fmtDate = s => { if (!s) return ''; const d = new Date(String(s).slice(0,10) + 'T12:00'); return isNaN(d) ? String(s) : d.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}); };
const fmtDay = s => { const d = new Date(s + 'T12:00'); return d.toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long'}); };
const fmtTime = t => { if (!t) return ''; const [h, m] = String(t).split(':'); const H = +h; if (isNaN(H)) return t; return `${H % 12 || 12}:${(m||'00').slice(0,2)} ${H >= 12 ? 'PM' : 'AM'}`; };
const rs = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const num = v => Number(String(v ?? '').replace(/[^\d.-]/g, '')) || 0;
const initials = n => String(n || '?').trim().split(/\s+/).filter(w => !/^dr\.?$/i.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
const avColor = s => AVC[[...String(s || '')].reduce((a, c) => a + c.charCodeAt(0), 0) % AVC.length];
const digits = p => String(p || '').replace(/\D/g, '');
const waNum = p => { let d = digits(p); if (d.length === 10) d = '91' + d; if (d.length === 11 && d[0] === '0') d = '91' + d.slice(1); return d; };
const clinicTag = c => c && CLINICS[c] ? `<span class="cdot" style="background:${CCOLOR[c]}"></span> ${CLINICS[c]}` : '';

function toast(msg, undo) {
  const r = $('#toastRoot');
  r.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${undo ? '<button id="undoBtn">Undo</button>' : ''}</div>`;
  if (undo) $('#undoBtn').onclick = () => { undo(); r.innerHTML = ''; };
  clearTimeout(toast.t);
  toast.t = setTimeout(() => r.innerHTML = '', undo ? 6000 : 2800);
}

// ════════════════════════════════════════════════════════════════════════
//  Local cache (IndexedDB) — so the app opens instantly and works offline
// ════════════════════════════════════════════════════════════════════════
const IDB = {
  db: null,
  open() {
    return new Promise((ok, bad) => {
      const r = indexedDB.open('handral-clinic', 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('docs'); d.createObjectStore('outbox'); d.createObjectStore('meta'); };
      r.onsuccess = () => { this.db = r.result; ok(); };
      r.onerror = () => bad(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((ok, bad) => {
      if (!this.db) return ok();
      const t = this.db.transaction(store, mode); const s = t.objectStore(store); let out;
      Promise.resolve(fn(s)).then(v => out = v);
      t.oncomplete = () => ok(out); t.onerror = () => bad(t.error);
    });
  },
  all(store) { return new Promise((ok, bad) => { if (!this.db) return ok([]); const out = []; const c = this.db.transaction(store).objectStore(store).openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out.push([cur.key, cur.value]); cur.continue(); } else ok(out); }; c.onerror = () => bad(c.error); }); },
  put(store, k, v) { return this.tx(store, 'readwrite', s => s.put(v, k)); },
  del(store, k) { return this.tx(store, 'readwrite', s => s.delete(k)); },
  clear() { return Promise.all(['docs','outbox','meta'].map(st => this.tx(st, 'readwrite', s => s.clear()))); },
};

// ════════════════════════════════════════════════════════════════════════
//  Data store + cloud sync
// ════════════════════════════════════════════════════════════════════════
const S = { docs: {}, outbox: new Map(), rev: 0, me: null, ai: false, loaded: false };
COLS.forEach(c => S.docs[c] = new Map());
let API = localStorage.getItem('hd_api') || API_DEFAULT;
let TOKEN = localStorage.getItem('hd_token') || '';

const all = col => [...S.docs[col].values()];
const get = (col, id) => S.docs[col].get(String(id));

function put(col, obj) {
  obj.id = String(obj.id || uid(col[0]));
  obj.updatedAt = Date.now();
  if (S.me) obj.updatedBy = S.me.name;
  S.docs[col].set(obj.id, obj);
  queue(col, obj.id, obj, false);
  return obj;
}
function remove(col, id) {
  const old = get(col, id); if (!old) return null;
  S.docs[col].delete(String(id));
  queue(col, String(id), null, true);
  return old;
}
function queue(col, id, data, deleted) {
  const k = col + '|' + id;
  const item = { col, id, data: data ? JSON.parse(JSON.stringify(data)) : null, deleted, stamp: uid() };
  S.outbox.set(k, item);
  IDB.put('outbox', k, item);
  if (deleted) IDB.del('docs', k); else IDB.put('docs', k, item.data);
  setSync('saving');
  clearTimeout(queue.t); queue.t = setTimeout(push, 600);
}

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (TOKEN) headers.Authorization = 'Bearer ' + TOKEN;
  if (opts.json !== undefined) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  let r;
  try { r = await fetch(API + path, { method: opts.method || (opts.body ? 'POST' : 'GET'), headers, body: opts.body }); }
  catch (e) { const err = new Error('No internet connection'); err.offline = true; throw err; }
  if (r.status === 401 && path !== '/api/login') { signedOut(); throw new Error('Please sign in again'); }
  if (opts.raw) { if (!r.ok) throw new Error('Could not load'); return r; }
  let body = {}; try { body = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(body.error || ('Server error ' + r.status));
  return body;
}

let pushing = false;
async function push() {
  if (pushing || !TOKEN) return;
  if (!S.outbox.size) { setSync('ok'); return; }
  pushing = true;
  try {
    while (S.outbox.size) {
      const batch = [...S.outbox.values()].slice(0, 150);
      await api('/api/save', { json: { changes: batch.map(b => ({ col: b.col, id: b.id, data: b.data, deleted: b.deleted })) } });
      for (const b of batch) {
        const k = b.col + '|' + b.id;
        if (S.outbox.get(k) && S.outbox.get(k).stamp === b.stamp) { S.outbox.delete(k); IDB.del('outbox', k); }
      }
    }
    setSync('ok');
    pull();
  } catch (e) {
    setSync(e.offline ? 'offline' : 'error', e.message);
    clearTimeout(push.retry); push.retry = setTimeout(push, 8000);
  } finally { pushing = false; }
}

let pulling = false;
async function pull() {
  if (pulling || !TOKEN) return;
  pulling = true;
  let changed = false;
  try {
    for (let guard = 0; guard < 200; guard++) {
      const r = await api('/api/changes?since=' + S.rev);
      for (const d of r.docs) {
        const k = d.col + '|' + d.id;
        if (!S.docs[d.col] || S.outbox.has(k)) continue;   // our unsent edit wins until it is saved
        if (d.deleted) { S.docs[d.col].delete(d.id); IDB.del('docs', k); }
        else { S.docs[d.col].set(d.id, d.data); IDB.put('docs', k, d.data); }
        changed = true;
      }
      S.rev = r.rev; IDB.put('meta', 'rev', S.rev); S.synced = true;
      if (!r.more) break;
    }
    if (!S.outbox.size) setSync('ok');
  } catch (e) {
    if (e.offline) setSync('offline');
  } finally { pulling = false; }
  if (changed && S.loaded) softRender();
  return changed;
}

function setSync(state, msg) {
  const el = $('#sync'); if (!el) return;
  el.className = 'sync ' + (state === 'ok' ? '' : state);
  const n = S.outbox.size;
  $('#syncTxt').textContent = state === 'ok' ? 'Saved to cloud' : state === 'saving' ? 'Saving…'
    : state === 'offline' ? (n ? `Offline · ${n} to save` : 'Offline') : 'Not saved — retrying';
  el.title = msg || '';
}

async function loadCache() {
  try {
    await IDB.open();
    const owner = (await IDB.all('meta')).find(([k]) => k === 'user');
    if (owner && S.me && owner[1] !== S.me.username) { await IDB.clear(); }
    for (const [k, v] of await IDB.all('docs')) { const [c, id] = k.split('|'); if (S.docs[c]) S.docs[c].set(id, v); }
    for (const [k, v] of await IDB.all('outbox')) S.outbox.set(k, v);
    const m = Object.fromEntries(await IDB.all('meta'));
    S.rev = m.rev || 0;
    if (S.me) IDB.put('meta', 'user', S.me.username);
  } catch (e) { console.warn('Cache unavailable', e); }
}

// ════════════════════════════════════════════════════════════════════════
//  Sign in / out
// ════════════════════════════════════════════════════════════════════════
$('#lgServer').value = localStorage.getItem('hd_api') || '';
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const srv = $('#lgServer').value.trim().replace(/\/+$/, '');
  API = srv || API_DEFAULT;
  if (srv) localStorage.setItem('hd_api', srv); else localStorage.removeItem('hd_api');
  $('#lgBtn').disabled = true; $('#lgBtn').textContent = 'Signing in…'; $('#loginErr').classList.add('hidden');
  try {
    const r = await api('/api/login', { json: { username: $('#lgUser').value.trim(), password: $('#lgPass').value } });
    TOKEN = r.token; localStorage.setItem('hd_token', TOKEN);
    $('#lgPass').value = '';
    await start();
  } catch (err) {
    if (err.offline) $('#loginErr').innerHTML = 'Could not reach the clinic server. Check the internet connection.<br><br>If the cloud server has not been set up yet, <a href="old.html" style="font-weight:700;text-decoration:underline">open the old app (records on this device only)</a>.';
    else $('#loginErr').textContent = err.message;
    $('#loginErr').classList.remove('hidden');
  }
  $('#lgBtn').disabled = false; $('#lgBtn').textContent = 'Sign in';
};

function signedOut() {
  TOKEN = ''; localStorage.removeItem('hd_token');
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  closeSheet();
}
async function signOut() {
  if (S.outbox.size && !confirm(`${S.outbox.size} change(s) are not saved to the cloud yet (no internet). Sign out anyway and lose them?`)) return;
  try { await api('/api/logout', { method: 'POST' }); } catch (e) {}
  await IDB.clear().catch(() => {});
  COLS.forEach(c => S.docs[c].clear()); S.outbox.clear(); S.rev = 0; S.me = null; S.loaded = false;
  signedOut();
}

async function start() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#main').innerHTML = '<div class="loading"><div class="spin"></div>Opening clinic records…</div>';
  let me;
  try { me = await api('/api/me'); }
  catch (e) {
    if (!TOKEN) return;
    const cached = JSON.parse(localStorage.getItem('hd_me') || 'null');
    if (!cached) { signedOut(); $('#loginErr').textContent = e.message; $('#loginErr').classList.remove('hidden'); return; }
    me = cached; setSync('offline');
  }
  S.me = me.user; S.ai = !!me.ai; localStorage.setItem('hd_me', JSON.stringify(me));
  await loadCache();
  $('#whoami').textContent = S.me.name;
  renderNav(); renderClinicBar();
  if (!S.rev) { $('#main').innerHTML = '<div class="loading"><div class="spin"></div>Downloading clinic records…</div>'; await pull(); }
  else pull();
  if (S.me.role === 'admin' && S.synced && !all('staff').length && !oldData())
    [['Dr RAVICHANDRA HANDRAL', 'Orthodontist'], ['Dr Vaishnavi Biradar', 'Dentist'], ['Jayashree', 'Attender'], ['Manjula', 'Attender'], ['Nandini', 'Attender']]
      .forEach(([name, role], i) => put('staff', { id: String(i + 1), name, role, active: true }));
  push();
  S.loaded = true;
  route();
}

// ════════════════════════════════════════════════════════════════════════
//  Navigation
// ════════════════════════════════════════════════════════════════════════
const NAV = [
  { v: 'today', label: 'Today', icon: 'home' },
  { v: 'patients', label: 'Patients', icon: 'users' },
  { v: 'calendar', label: 'Appointments', short: 'Appts', icon: 'cal' },
  { v: 'billing', label: 'Bills & cash', short: 'Bills', icon: 'bill' },
  { v: 'more', label: 'More', icon: 'more', mobileOnly: true },
  { v: 'staff', label: 'Staff attendance', icon: 'staff', desk: true },
  { v: 'consultants', label: 'Consultants', icon: 'tooth', desk: true },
  { v: 'reports', label: 'Reports', icon: 'chart', desk: true },
  { v: 'scan', label: 'Read register (AI)', icon: 'scan', desk: true },
  { v: 'settings', label: 'Settings', icon: 'gear', desk: true },
];
let CLINIC = localStorage.getItem('hd_clinic') || 'all';
const inClinic = r => CLINIC === 'all' || !r.clinic || r.clinic === CLINIC;
const defClinic = () => CLINIC === 'all' ? 'bagalkot' : CLINIC;

function renderNav() {
  const v = curView();
  $('#side').innerHTML = NAV.filter(n => !n.mobileOnly).map((n, i) => (i === 4 ? '<hr>' : '') +
    `<button class="${v === n.v ? 'on' : ''}" onclick="go('${n.v}')">${icon(n.icon)}${n.label}</button>`).join('') +
    `<hr><button onclick="signOut()">${icon('out')}Sign out</button>`;
  const moreViews = NAV.filter(n => n.desk).map(n => n.v);
  $('#bnav').innerHTML = NAV.filter(n => !n.desk).map(n => {
    const on = v === n.v || (n.v === 'more' && moreViews.includes(v)) || (n.v === 'patients' && v === 'patient');
    return `<button class="${on ? 'on' : ''}" onclick="go('${n.v}')">${icon(n.icon, 'width:23px;height:23px')}${n.short || n.label}</button>`;
  }).join('');
}
function renderClinicBar() {
  $('#clinicbar').innerHTML = [['all', 'All clinics']].concat(Object.entries(CLINICS)).map(([k, l]) =>
    `<button class="cchip ${CLINIC === k ? 'on' : ''}" onclick="setClinic('${k}')">${k === 'all' ? '' : `<span class="d" style="background:${CCOLOR[k]}"></span>`}${l}</button>`).join('');
}
function setClinic(c) { CLINIC = c; localStorage.setItem('hd_clinic', c); renderClinicBar(); render(); }

const curView = () => (location.hash.slice(1).split('/')[0]) || 'today';
function go(v, id, tab) { const h = '#' + [v, id, tab].filter(Boolean).join('/'); if (location.hash === h) render(); else location.hash = h; }
window.addEventListener('hashchange', route);
function route() { if (!S.loaded) return; closeSheet(); renderNav(); render(); window.scrollTo(0, 0); }
function render() {
  const [v, id, tab] = location.hash.slice(1).split('/');
  const fn = VIEWS[v || 'today'] || VIEWS.today;
  $('#main').innerHTML = fn(id && decodeURIComponent(id), tab) || '';
  after.forEach(f => f()); after = [];
}
let after = [];
// Re-render after cloud changes, but never while someone is typing.
function softRender() {
  const a = document.activeElement;
  if ($('#sheetRoot').innerHTML || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $('#main').contains(a))) { softRender.pending = true; return; }
  render();
}
setInterval(() => { if (softRender.pending) { softRender.pending = false; softRender(); } }, 3000);

// ════════════════════════════════════════════════════════════════════════
//  Sheet (pop-up form)
// ════════════════════════════════════════════════════════════════════════
let sheetSave = null;
function sheet(title, body, opts = {}) {
  sheetSave = opts.onSave || null;
  $('#sheetRoot').innerHTML = `<div class="sheet-bg" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog" aria-label="${esc(title)}">
    <div class="sheet-h"><h3>${esc(title)}</h3><button class="iconbtn" onclick="closeSheet()" aria-label="Close">${icon('x')}</button></div>
    <div class="sheet-b">${body}</div>
    ${opts.onSave || opts.footer ? `<div class="sheet-f">${opts.footer || ''}${opts.onSave ? `<button class="btn" id="sheetSaveBtn" onclick="doSheetSave()">${esc(opts.saveText || 'Save')}</button>` : ''}</div>` : ''}
  </div></div>`;
  const first = $('#sheetRoot').querySelector('input:not([type=hidden]):not([type=file]),textarea');
  if (first && opts.focus !== false && window.innerWidth > 700) setTimeout(() => first.focus(), 50);
}
async function doSheetSave() {
  if (!sheetSave) return;
  const b = $('#sheetSaveBtn'); b.disabled = true;
  try { const keep = await sheetSave(); if (keep !== false) closeSheet(); }
  catch (e) { toast(e.message); }
  if (b) b.disabled = false;
}
function closeSheet() { $('#sheetRoot').innerHTML = ''; sheetSave = null; if (softRender.pending) { softRender.pending = false; render(); } }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const need = (v, msg) => { if (!v) throw new Error(msg); return v; };

//  Shared lookups
// ════════════════════════════════════════════════════════════════════════
function settings() {
  return Object.assign({ name: 'Handral Dentistry', doctor: 'Dr. R.K. Handral', phone: '', address: 'Bagalkot, Karnataka', gstin: '',
    waTemplate: 'Hello {name}, your appointment at Handral Dentistry ({clinic}) is on {date} at {time}. Please reply YES to confirm. – Dr. R.K. Handral' }, get('settings', 'clinic') || {});
}
const doctors = () => {
  const s = all('staff').filter(x => /dr|dentist|ortho|bds|mds|surgeon/i.test(x.name + ' ' + (x.role || ''))).map(x => x.name);
  const c = all('consultants').filter(x => x.active !== false).map(x => x.name);
  return [...new Set(['Dr. R.K. Handral', ...s, ...c])];
};
const patientOf = r => r.patientId ? get('patients', r.patientId) : null;
const apptsOf = pid => all('appointments').filter(a => a.patientId === pid).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
const invoicesOf = pid => all('invoices').filter(i => i.patientId === pid).sort((a, b) => String(b.date).localeCompare(a.date));
const paymentsOf = pid => all('payments').filter(p => p.patientId === pid).sort((a, b) => String(b.date).localeCompare(a.date));
const paidOn = inv => all('payments').filter(p => p.invoiceId === inv.id).reduce((s, p) => s + num(p.amount), 0);
function invStatus(inv) { const p = paidOn(inv), t = num(inv.total); return p >= t - 0.5 ? 'paid' : p > 0 ? 'partly' : 'due'; }
function balanceOf(pid) {
  const billed = invoicesOf(pid).reduce((s, i) => s + num(i.total), 0);
  const paid = paymentsOf(pid).reduce((s, p) => s + num(p.amount), 0);
  return billed - paid;
}
function lastVisit(p) {
  const a = apptsOf(p.id).find(x => x.date <= today() && x.status !== 'cancelled' && x.status !== 'noshow');
  return a ? a.date : (p.date || '');
}
function waLink(phone, text) { return `https://wa.me/${waNum(phone)}?text=${encodeURIComponent(text)}`; }
function apptMessage(a) {
  return settings().waTemplate.replace(/\{name\}/g, a.name || '').replace(/\{date\}/g, fmtDate(a.date)).replace(/\{time\}/g, fmtTime(a.time) || '')
    .replace(/\{clinic\}/g, CLINICS[a.clinic] || '').replace(/\{treatment\}/g, a.treatment || '');
}

function pkPick(id) { const p = get('patients', id); $('#pk_id').value = id; $('#pk_selname').textContent = p.name; $('#pk_sel').classList.remove('hidden'); $('#pk_new').classList.add('hidden'); }
function pkClear() { $('#pk_id').value = ''; $('#pk_sel').classList.add('hidden'); $('#pk_new').classList.remove('hidden'); }
// Returns the chosen patient, creating a new one if a new name was typed.
function pkResolve(clinic) {
  const id = val('pk_id'); if (id) return get('patients', id);
  const name = need(val('pk_name'), 'Enter the patient name');

  const same = all('patients').find(p => p.name.toLowerCase() === name.toLowerCase() && (!phone || digits(p.phone) === digits(phone)));

const opt = (list, v) => list.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');

    : st === 'done' && !all('invoices').some(i => i.apptId === a.id) ? `<button class="btn sm soft" onclick="event.stopPropagation();billAppt('${esc(a.id)}')">${icon('bill', 'width:16px;height:16px')}Bill</button>` : '';
  return `<div class="row tap" onclick="apptMenu('${esc(a.id)}')">

    <div class="rmain"><b>${esc(a.name)}</b><small>${esc(a.treatment || 'Visit')}${a.doctor ? ' · ' + esc(a.doctor) : ''}${CLINIC === 'all' && a.clinic ? ' · ' + esc(CLINICS[a.clinic] || '') : ''}</small></div>
    <div class="rend"><span class="tag ${st === 'confirmed' ? 'booked' : st} ${next ? 'hide-sm' : ''}">${label}</span>${next}</div>

}
function billAppt(id) { const a = get('appointments', id); editInvoice({ patientId: a.patientId, name: a.name, phone: a.phone, apptId: a.id, clinic: a.clinic, item: a.treatment }); }

function markConfirmSent(id) { const a = get('appointments', id); if (a) { a.reminderSent = today(); put('appointments', a); } }
function dueReminders() {

function editPatient(p) {
  p = p || {}; const isNew = !p.id;
  sheet(isNew ? 'New patient' : 'Edit patient', `
    <label class="f"><span>Full name *</span><input id="f_name" value="${esc(p.name)}" autocapitalize="words"/></label>
    <div class="grid2">
      <label class="f"><span>Mobile</span><input id="f_phone" type="tel" inputmode="tel" value="${esc(p.phone)}"/></label>
      <label class="f"><span>Clinic</span>${clinicSelect('f_clinic', p.clinic)}</label>
    </div>
    <div class="grid2">
      <label class="f"><span>Age</span><input id="f_age" inputmode="numeric" value="${esc(p.age)}"/></label>
      <label class="f"><span>Gender</span><select id="f_gender"><option value=""></option>${opt(['Male', 'Female', 'Other'], ({ M: 'Male', F: 'Female' })[p.gender] || p.gender)}</select></label>
    </div>
    <label class="f"><span>Main complaint</span><input id="f_complaint" value="${esc(p.complaint)}" placeholder="e.g. pain in lower left tooth"/></label>
    <label class="f"><span>Medical history / allergies</span><input id="f_medical" value="${esc(p.medical)}" placeholder="e.g. diabetic, allergic to penicillin"/></label>
    <label class="f"><span>Address</span><input id="f_address" value="${esc(p.address)}"/></label>
    <label class="f"><span>Referred by</span><input id="f_ref" value="${esc(p.referredBy)}"/></label>
    ${isNew ? '' : `<button class="btn danger block" type="button" onclick="deletePatient('${esc(p.id)}')">${icon('trash')}Delete patient</button>`}`,
  { saveText: isNew ? 'Add patient' : 'Save', onSave: () => {
      const name = need(val('f_name'), 'Enter the patient name');
      const phone = val('f_phone');
      if (isNew && phone && all('patients').some(x => digits(x.phone) === digits(phone) && x.name.toLowerCase() === name.toLowerCase()))
        throw new Error('This patient is already registered');
      const rec = Object.assign({}, p, { name, phone, clinic: val('f_clinic'), age: val('f_age'), gender: val('f_gender'), complaint: val('f_complaint'),
        medical: val('f_medical'), address: val('f_address'), referredBy: val('f_ref'), date: p.date || today() });
      put('patients', rec);
      toast(isNew ? 'Patient added' : 'Saved');
      if (isNew) go('patient', rec.id); else render();
  } });
}
function deletePatient(id) {
  const p = get('patients', id);
  if (!confirm(`Delete ${p.name}? Their appointments and bills stay in the records.`)) return;
  remove('patients', id); closeSheet(); go('patients');
  toast('Patient deleted', () => { put('patients', p); go('patient', p.id); });
}

const imgCache = {};
async function loadImg(fid, elId) {
  const el = document.getElementById(elId); if (!el || !fid) return;
  if (!imgCache[fid]) imgCache[fid] = api('/api/files/' + fid, { raw: true }).then(r => r.blob()).then(b => URL.createObjectURL(b)).catch(() => { delete imgCache[fid]; return ''; });
  const u = await imgCache[fid]; if (u && document.getElementById(elId)) document.getElementById(elId).src = u;
}
function pickPhoto(pid, type) {
  const f = $('#filePick'); f.value = '';
  f.onchange = async () => {
    const file = f.files[0]; if (!file) return;
    toast('Uploading…');
    try {
      const blob = await shrink(file, 2000);
      const r = await api('/api/files', { method: 'POST', body: blob, headers: { 'Content-Type': blob.type } });
      put('photos', { patientId: pid, fileId: r.id, type, date: today(), clinic: (get('patients', pid) || {}).clinic });
      toast(type + ' saved'); render();
    } catch (e) { toast(e.offline ? 'No internet — photo not saved. Try again when online.' : e.message); }
  };

}
function viewPhoto(id) {
  const x = get('photos', id);
  const d = document.createElement('div'); d.className = 'viewer';
  d.innerHTML = `<img id="vimg" alt=""/><div style="display:flex;gap:10px"><button class="btn ghost" id="vclose">Close</button><button class="btn danger" id="vdel">${icon('trash')}Delete</button></div>`;
  document.body.appendChild(d); loadImg(x.fileId, 'vimg');
  d.onclick = e => { if (e.target === d || e.target.id === 'vclose') d.remove(); };

}
// Resize a photo before upload: faster on clinic Wi-Fi and plenty for records.
function shrink(file, max) {
  return new Promise(ok => {
    if (!/^image\/(jpeg|png|webp)/.test(file.type)) return ok(file);
    const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(b => ok(b || file), 'image/jpeg', 0.85);
    };
    img.onerror = () => ok(file); img.src = u;
  });
}

    ${rows.length > 1 ? `<tr><th>Total</th><th class="n">${tot.newP}</th><th class="n">${tot.booked}</th><th class="n">${tot.visits}</th><th class="n">${tot.noshow}</th><th class="n">${rs(tot.billed)}</th><th class="n">${rs(tot.got)}</th><th class="n">${rs(tot.spent)}</th></tr>` : ''}</table></div>

function scanPick() {
  scanClinic = val('f_sclinic') || scanClinic;

    const file = f.files[0]; if (!file) return;
    $('#main').innerHTML = '<div class="loading"><div class="spin"></div>Reading the page… this takes about 20 seconds.</div>';
    try {
      const blob = await shrink(file, 1800);

      const res = await api('/api/ai/read', { json: { image: b64, mime: blob.type || 'image/jpeg', names: all('patients').map(p => p.name).slice(0, 400) } });
      scanRows = (res.entries || []).map(e => {
        const m = e.match ? all('patients').find(p => p.name.toLowerCase() === String(e.match).toLowerCase()) : all('patients').find(p => e.phone && digits(p.phone) === digits(e.phone));
        return Object.assign({ use: true, pid: m ? m.id : '' }, e);
      });
      if (!scanRows.length) { scanRows = null; toast('Could not find any entries on that page'); }
    } catch (e) { toast(e.message); }
    render();
  };
  f.click();
}
function scanReview() {
  return `<div class="head"><div class="grow"><h2 class="title">Check what was read</h2><p class="muted">${scanRows.length} entries · ${CLINICS[scanClinic]}. Fix anything wrong, untick rows to skip.</p></div>

function editUser(id) {
  const u = USERS.find(x => x.id === id) || { role: 'staff', active: true };
  sheet(id ? 'Edit login' : 'Add a login', `
    <label class="f"><span>Person's name</span><input id="u_name" value="${esc(u.name)}"/></label>
    ${id ? `<p class="muted" style="margin:-4px 0 12px">Username: <b>${esc(u.username)}</b></p>` : `<label class="f"><span>Username (for signing in)</span><input id="u_user" autocapitalize="none" placeholder="e.g. jayashree"/></label>`}
    <label class="f"><span>${id ? 'New password (leave empty to keep)' : 'Password (at least 6 characters)'}</span><input id="u_pw" type="text" autocomplete="new-password"/></label>
    <label class="f"><span>Access</span><select id="u_role"><option value="staff">Staff — patients, appointments, bills</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Doctor — everything, incl. settings and logins</option></select></label>
    ${id ? `<label class="f"><span>Status</span><select id="u_active"><option value="1">Can sign in</option><option value="0" ${u.active ? '' : 'selected'}>Turned off (cannot sign in)</option></select></label>` : ''}`,
  { onSave: async () => {
      const body = { id: id || undefined, name: val('u_name'), username: val('u_user'), password: val('u_pw'), role: val('u_role'), active: id ? val('u_active') === '1' : true };
      USERS = (await api('/api/users', { json: body })).users; loadUsers(); toast('Login saved');
  } });
}
function changeMyPassword() {
  sheet('Change my password', `<label class="f"><span>Current password</span><input id="m_old" type="password" autocomplete="current-password"/></label>
    <label class="f"><span>New password (at least 6 characters)</span><input id="m_new" type="password" autocomplete="new-password"/></label>`,
  { onSave: async () => { await api('/api/users', { json: { id: S.me.id, old_password: val('m_old'), password: val('m_new') } }); toast('Password changed'); } });
}

// ════════════════════════════════════════════════════════════════════════
//  Moving records saved by the old app (on this device only) to the cloud
// ════════════════════════════════════════════════════════════════════════
function oldData() {
  try {
    const g = k => JSON.parse(localStorage.getItem(k) || '[]');
    const d = { patients: g('hd_patients'), appointments: g('hd_appointments'), transactions: g('hd_transactions'), invoices: g('hd_invoices'),
      attendance: g('hd_attendance'), staff: g('hd_staff'), consultants: g('hd_consultants'), consultcases: g('hd_consultcases') };
    const n = d.patients.length + d.appointments.length + d.invoices.length + d.transactions.length + d.attendance.length + d.consultcases.length;
    return n ? d : null;
  } catch (e) { return null; }
}
function migrationBanner() {
  if (localStorage.getItem('hd_migrated')) return '';
  const d = oldData(); if (!d) return '';
  return `<div class="banner info" id="migBanner">${icon('cloud', 'width:26px;height:26px;margin-top:2px')}<div style="flex:1">
    <b>Records found on this device</b><br>This ${/iPad|Android|Tablet/i.test(navigator.userAgent) ? 'tablet' : 'device'} has ${d.patients.length} patients, ${d.appointments.length} appointments and ${d.invoices.length} bills from the old app that are not in the cloud yet.
    <div style="margin-top:10px"><button class="btn sm" onclick="migrate()">${icon('cloud', 'width:17px;height:17px')}Move them to the cloud</button></div></div></div>`;
}
async function migrate() {
  const d = oldData(); if (!d) return;
  const btn = $('#migBanner button'); if (btn) { btn.disabled = true; btn.textContent = 'Moving…'; }
  const S_ = id => String(id);
  const byKey = {}; const pidFor = (name, phone) => { const n = String(name || '').toLowerCase().trim(); const ph = digits(phone);
    return (ph && byKey['ph:' + ph + '|' + n]) || (ph && byKey['ph:' + ph]) || byKey['n:' + n] || ''; };
  let photos = 0, photoFails = 0;
  const allInv = new Map(), allPay = new Map(), allAppt = new Map();
  // Patients (with the bits the old app kept inside each patient)
  for (const o of d.patients) {
    if (!o || !o.name) continue;
    const id = S_(o.id || uid('p')); const p = Object.assign({}, o, { id });
    if (!Array.isArray(p.notes)) p.notes = p.notes ? [{ id: uid('n'), date: p.date || today(), text: String(p.notes) }] : [];
    if (p.chart) for (const k in p.chart) { const c = p.chart[k]; if (c && c.condition === 'healthy' || c && c.condition === 'normal') c.condition = ''; }
    const pics = Array.isArray(p.photos) ? p.photos : [];
    ['photos', 'invoices', 'payments', 'appointments'].forEach(k => delete p[k]);
    p.clinic = p.clinic || 'bagalkot';
    if (!get('patients', id)) put('patients', p);
    byKey['n:' + p.name.toLowerCase().trim()] = byKey['n:' + p.name.toLowerCase().trim()] || id;
    if (digits(p.phone)) { byKey['ph:' + digits(p.phone)] = id; byKey['ph:' + digits(p.phone) + '|' + p.name.toLowerCase().trim()] = id; }
    (o.invoices || []).forEach(i => allInv.set(S_(i.id), Object.assign({ patientId: id, patient: p.name, clinic: p.clinic }, i)));
    (o.payments || []).forEach(x => allPay.set(S_(x.id), Object.assign({ patientId: id, patient: p.name, clinic: p.clinic }, x)));
    (o.appointments || []).forEach(a => allAppt.set(S_(a.id), Object.assign({ patientId: id, name: p.name, phone: p.phone, clinic: p.clinic }, a)));
    for (const ph of pics) {
      if (!ph || !String(ph.src || '').startsWith('data:')) continue;
      try { const blob = await (await fetch(ph.src)).blob(); const r = await api('/api/files', { method: 'POST', body: blob, headers: { 'Content-Type': blob.type || 'image/jpeg' } });
        put('photos', { id: 'm' + S_(ph.id || uid('ph')), patientId: id, fileId: r.id, type: ph.type || 'Photo', date: ph.date || p.date || today(), clinic: p.clinic }); photos++; }
      catch (e) { photoFails++; }
    }
  }
  d.invoices.forEach(i => allInv.set(S_(i.id), Object.assign({}, allInv.get(S_(i.id)) || {}, i)));
  d.appointments.forEach(a => allAppt.set(S_(a.id), Object.assign({}, allAppt.get(S_(a.id)) || {}, a)));
  for (const [id, a] of allAppt) {
    if (get('appointments', id)) continue;
    const st = { pending: 'booked', confirmed: 'confirmed', done: 'done', completed: 'done', cancelled: 'cancelled' }[a.status] || 'booked';
    put('appointments', Object.assign({}, a, { id, patientId: a.patientId || pidFor(a.name, a.phone), treatment: a.treatment || a.tx || '', status: st, clinic: a.clinic || 'bagalkot' }));
  }
  const paidInv = new Set([...allPay.values()].map(x => S_(x.invId || '')));
  for (const [id, i] of allInv) {
    if (get('invoices', id)) continue;
    const pid = i.patientId || pidFor(i.patient, i.phone);
    put('invoices', Object.assign({}, i, { id, no: i.no || id, patientId: pid, clinic: i.clinic || 'bagalkot', total: num(i.total), items: (i.items || []).map(x => ({ desc: x.desc || x.description || 'Treatment', qty: num(x.qty) || 1, price: num(x.price ?? x.rate ?? x.amount) })) }));
    if (i.status === 'paid' && !paidInv.has(id)) put('payments', { id: 'mp' + id, patientId: pid, patient: i.patient, invoiceId: id, amount: num(i.total), mode: i.payMode || 'Cash', date: i.date || today(), clinic: i.clinic || 'bagalkot' });
  }
  for (const [id, x] of allPay) if (!get('payments', id)) put('payments', Object.assign({}, x, { id, invoiceId: S_(x.invId || ''), amount: num(x.amount), clinic: x.clinic || 'bagalkot' }));
  for (const x of d.transactions) { const id = S_(x.id || uid('t')); if (!get('transactions', id)) put('transactions', Object.assign({}, x, { id, amount: num(x.amount), clinic: x.clinic || 'bagalkot', legacyTreatment: x.type !== 'out' && /treatment|consultation/i.test(x.category || '') ? true : undefined })); }
  for (const x of d.staff) { const id = S_(x.id); if (!get('staff', id)) put('staff', Object.assign({}, x, { id, active: true })); }
  for (const x of d.attendance) { const id = S_(x.id); if (!get('attendance', id)) put('attendance', Object.assign({}, x, { id, staffId: S_(x.staffId) })); }
  for (const x of d.consultants) { const id = S_(x.id); if (!get('consultants', id)) put('consultants', Object.assign({}, x, { id })); }
  for (const x of d.consultcases) { const id = S_(x.id); if (!get('consultcases', id)) put('consultcases', Object.assign({}, x, { id, consultId: S_(x.consultId), patientId: pidFor(x.patient), fee: num(x.fee) })); }
  if (S.me.role === 'admin' && !get('settings', 'clinic')) {
    const st = {}; [['name', 'hd_clinicName'], ['address', 'hd_clinicAddr'], ['phone', 'hd_clinicPhone'], ['waTemplate', 'hd_waTemplate']].forEach(([k, l]) => { const v = localStorage.getItem(l); if (v) st[k] = v; });
    if (Object.keys(st).length) put('settings', Object.assign({ id: 'clinic' }, st));
  }
  await push();
  if (S.outbox.size) { toast('Saved on this device; will finish sending when the internet is back'); }
  localStorage.setItem('hd_migrated', new Date().toISOString());
  toast(`Moved ${d.patients.length} patients to the cloud${photos ? `, ${photos} photos` : ''}${photoFails ? ` (${photoFails} photos failed)` : ''}`);
  render();
}

// ════════════════════════════════════════════════════════════════════════
//  Keep in step with other devices
// ════════════════════════════════════════════════════════════════════════
setInterval(() => { if (S.loaded && document.visibilityState === 'visible') { pull(); if (S.outbox.size) push(); } }, 15000);
document.addEventListener('visibilitychange', () => { if (S.loaded && document.visibilityState === 'visible') { pull(); push(); } });
window.addEventListener('online', () => { if (S.loaded) { push(); pull(); } });
window.addEventListener('offline', () => setSync('offline'));
window.addEventListener('beforeunload', e => { if (S.outbox.size && !navigator.onLine) { e.preventDefault(); e.returnValue = ''; } });

if (TOKEN) start(); else $('#login').classList.remove('hidden');
</script>
